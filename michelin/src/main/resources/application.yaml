spring:
  application:
    name: michelin
  datasource:
    url: jdbc:h2:./michelin;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

s3:
  endpoint: https://s3.bober.ovh
  buckets:
    cover: ${S3_BUCKET_COVER:exo-cover}
    screenshot: ${S3_BUCKET_SCREENSHOT:exo-screenshot}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
